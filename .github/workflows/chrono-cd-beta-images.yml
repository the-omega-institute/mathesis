name: Chrono CD beta images (one-off)

on:
  push:
    branches: [codex/chrono-cd-beta-20261020]
    paths:
      - "api/**"
      - "web/**"
      - "sdk/**"
      - "infra/**"
      - ".github/workflows/chrono-cd-beta-images.yml"

permissions:
  contents: read

concurrency:
  group: chrono-cd-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  structure:
    name: Repository structure and layer rule
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Root contains only the allowed entries
        run: |
          allowed=".git .github .gitignore .dockerignore CLAUDE.md README.md api web sdk infra docs"
          for entry in $(ls -A); do
            case " $allowed " in *" $entry "*) ;; *) echo "::error::unexpected root entry: $entry"; exit 1 ;; esac
          done
      - name: infra contains only the fixed file list
        run: |
          expected="infra/api/Dockerfile infra/api/configmap.yaml infra/api/deployment.yaml infra/api/secret.yaml infra/api/service.yaml infra/web/Dockerfile infra/web/deployment.yaml infra/web/nginx.conf infra/web/service.yaml infra/worker/deployment.yaml infra/worker/pvc.yaml infra/verifier/Dockerfile infra/verifier/Lean.Dockerfile infra/verifier/lean-toolchain infra/verifier/lakefile.toml infra/verifier/deployment.yaml"
          actual=$(find infra -type f | sort | tr '\n' ' ')
          [ "$(echo $expected | tr ' ' '\n' | sort | tr '\n' ' ')" = "$actual" ] || { echo "::error::infra/ diverged: $actual"; exit 1; }
      - name: Layer dependency rule
        run: |
          production_dependencies() {
            awk '/^\[dependencies\]$/ { d=1; next } /^\[/ { d=0 } d { print }' "$1"
          }
          fail=0
          production_dependencies api/crates/layer2-core/Cargo.toml | grep -qE 'mathesis-(public|review|latex)|mongodb|axum|reqwest|jsonwebtoken' \
            && { echo "::error::layer2-core must not depend on Layer 1, Layer 3 or I/O crates"; fail=1; }
          production_dependencies api/crates/layer1-public/Cargo.toml | grep -qE 'mathesis-(review|latex)|mongodb|reqwest' \
            && { echo "::error::layer1-public may depend only on layer2-core"; fail=1; }
          for crate in layer3-review layer3-latex; do
            production_dependencies api/crates/$crate/Cargo.toml | grep -qE 'mathesis-(core|public)' \
              && { echo "::error::$crate must not depend on Layer 1 or Layer 2"; fail=1; }
          done
          exit $fail
      - name: Every config key is declared in infra
        run: |
          keys=$(grep -ohE '"(WISHPOOL|CHRONO)_[A-Z_]+"' api/crates/mathesis/src/config.rs | tr -d '"' | sort -u)
          for key in $keys; do
            grep -q "^  $key:" infra/api/configmap.yaml infra/api/secret.yaml || { echo "::error::$key missing from infra/api"; exit 1; }
          done

  api:
    name: API (fmt, clippy, tests, deny)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    env:
      WISHPOOL_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      WISHPOOL_TEST_TEX_BIN: /usr/bin
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live for the compile tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: api/Cargo.toml

  sdk:
    name: Contributor SDK (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/contribute
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/contribute
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    name: Web (format, lint, types, tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:showcase
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned by checksum; the gitleaks GitHub Action needs
      # a paid licence on organisation repositories.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose .

  application-images:
    name: Publish ${{ matrix.component }} image
    needs: [structure, api, sdk, web, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, api]
    env:
      COMPONENT: ${{ matrix.component }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the reviewed revision for Linux amd64
        run: |
          image="ghcr.io/${REGISTRY_OWNER,,}/mathesis-${COMPONENT}:beta-20261020-${SOURCE_REVISION:0:12}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --label "org.opencontainers.image.version=beta-20261020-${SOURCE_REVISION:0:12}" \
            -f "infra/$COMPONENT/Dockerfile" -t "$image" .
      - name: Check image identity and non-root runtime
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != 0
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}'
      - name: Check frontend routes and English document
        if: matrix.component == 'web'
        run: |
          docker run -d --name mathesis-web-smoke --add-host wishpool-api:127.0.0.1 \
            -p 127.0.0.1:18080:8080 "$IMAGE"
          trap 'docker logs mathesis-web-smoke; docker rm -f mathesis-web-smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:18080/ -o /tmp/mathesis-web-index.html
          grep -q 'lang="en"' /tmp/mathesis-web-index.html
          curl --fail http://127.0.0.1:18080/submissions/smoke -o /tmp/mathesis-web-route.html
          cmp /tmp/mathesis-web-index.html /tmp/mathesis-web-route.html
          curl --fail http://127.0.0.1:18080/staff/submissions/smoke -o /tmp/mathesis-staff-route.html
          cmp /tmp/mathesis-web-index.html /tmp/mathesis-staff-route.html
      - name: Check API, worker and TeX runtime with isolated development settings
        if: matrix.component == 'api'
        run: |
          docker run --rm --network none \
            -e WISHPOOL_BIND=127.0.0.1:8080 -e WISHPOOL_PUBLIC_URL=http://127.0.0.1:8080 \
            -e WISHPOOL_AUTH_MODE=dev -e WISHPOOL_STORAGE=memory -e WISHPOOL_ROLE=api \
            "$IMAGE" --check
          docker run --rm --network none \
            -e WISHPOOL_BIND=127.0.0.1:8080 -e WISHPOOL_PUBLIC_URL=http://127.0.0.1:8080 \
            -e WISHPOOL_AUTH_MODE=dev -e WISHPOOL_STORAGE=memory -e WISHPOOL_ROLE=worker \
            "$IMAGE" --check
          docker run --rm --network none --entrypoint sh "$IMAGE" -ec '
            workdir=$(mktemp -d)
            cd "$workdir"
            printf "%s\n" "\\documentclass{article}" "\\begin{document}" "Mathesis runtime check." "\\end{document}" > main.tex
            pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex
            test -s main.pdf
          '
      - name: Validate existing deployment manifests
        if: matrix.component == 'web'
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary infra/api/*.yaml infra/web/*.yaml infra/worker/*.yaml infra/verifier/*.yaml
      - name: Publish unique beta tag and record immutable digest
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push "$IMAGE"
          mkdir -p image-receipts
          docker image inspect "$IMAGE" --format '{{json .}}' > "image-receipts/$COMPONENT.json"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$digest" > "image-receipts/$COMPONENT.txt"
          GH_TOKEN="$PUBLISH_TOKEN" gh api "orgs/$REGISTRY_OWNER/packages/container/mathesis-$COMPONENT" \
            --jq '{name, visibility, html_url, repository: .repository.full_name}' > "image-receipts/$COMPONENT-package.json"
          printf '### %s\n\n- Tag: `%s`\n- Digest: `%s`\n- Source: `%s`\n' \
            "$COMPONENT" "$IMAGE" "$digest" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-receipt-${{ matrix.component }}
          path: image-receipts/
          if-no-files-found: error

  verifier-image:
    name: Publish prepared Lean and tested verifier images
    needs: [structure, api, sdk, web, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room on this ephemeral runner for the pinned Mathlib workspace
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the prepared Lean base
        run: |
          image="ghcr.io/${REGISTRY_OWNER,,}/mathesis-lean:beta-20261020-${SOURCE_REVISION:0:12}"
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f infra/verifier/Lean.Dockerfile -t "$image" .
          test "$(docker run --rm --network none --entrypoint id "$image" -u)" != 0
          docker push "$image"
          mkdir -p image-receipts
          docker image inspect "$image" --format '{{json .}}' > image-receipts/lean.json
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$digest" > image-receipts/lean.txt
          echo "LEAN_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Build verifier against the published base digest and run real Lean tests
        run: |
          image="ghcr.io/${REGISTRY_OWNER,,}/mathesis-verifier:beta-20261020-${SOURCE_REVISION:0:12}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load \
            --build-arg "LEAN_IMAGE=$LEAN_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --label "org.opencontainers.image.base.name=$LEAN_IMAGE" \
            -f infra/verifier/Dockerfile -t "$image" .
      - name: Check non-root runtime and pinned workspace readiness without network access
        run: |
          test "$(docker run --rm --network none --entrypoint id "$IMAGE" -u)" != 0
          docker run -d --name mathesis-verifier-smoke --network none \
            -e WISHPOOL_LEAN_WORKSPACE=/opt/lean-workspace \
            -e WISHPOOL_VERIFIER_BIND=127.0.0.1:8081 "$IMAGE"
          trap 'docker logs mathesis-verifier-smoke; docker rm -f mathesis-verifier-smoke' EXIT
          for attempt in $(seq 1 15); do
            if docker exec mathesis-verifier-smoke curl --fail http://127.0.0.1:8081/readyz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Publish verifier and record immutable digests
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .}}' > image-receipts/verifier.json
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "$digest" > image-receipts/verifier.txt
          for component in lean verifier; do
            GH_TOKEN="$PUBLISH_TOKEN" gh api "orgs/$REGISTRY_OWNER/packages/container/mathesis-$component" \
              --jq '{name, visibility, html_url, repository: .repository.full_name}' > "image-receipts/$component-package.json"
          done
          printf '### Verifier\n\n- Tag: `%s`\n- Digest: `%s`\n- Lean base: `%s`\n- Source: `%s`\n' \
            "$IMAGE" "$digest" "$LEAN_IMAGE" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-receipt-verifier
          path: image-receipts/
          if-no-files-found: warn
