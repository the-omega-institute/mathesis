name: Mathesis web image (2026-10-23 only)
on:
  push:
    branches: [deploy/web-ux-20261023]
    paths: [.github/workflows/web-image-once-20261023.yml]
permissions:
  contents: read
jobs:
  web-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: a40b4422fe542b7b48df96e80b5ccef2036ff451
      IMAGE: ghcr.io/the-omega-institute/mathesis-web:ux-a40b442
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a40b4422fe542b7b48df96e80b5ccef2036ff451
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate web
        working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web image from verified source
        run: |
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=https://github.com/the-omega-institute/mathesis" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f infra/web/Dockerfile -t "$IMAGE" .
      - name: Verify non-root runtime
        run: test "$(docker run --rm --network none --entrypoint id "$IMAGE" -u)" != 0
      - name: Publish image and digest
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}'
