# Publishes the images that infra/ deploys to GitHub Packages. CI only builds them.
#
#   ghcr.io/<owner>/wishpool-web        infra/web/Dockerfile
#   ghcr.io/<owner>/wishpool-api        infra/api/Dockerfile (serves the api and worker roles)
#   ghcr.io/<owner>/wishpool-lean       infra/verifier/Lean.Dockerfile, the prepared Lean/Mathlib base
#   ghcr.io/<owner>/wishpool-verifier   infra/verifier/Dockerfile, built on that base by digest
#
# Every push to main and every vX.Y.Z tag publishes. Images are tagged with the short
# commit, the branch name and, for a tag, its version. The Lean base is tagged with a
# hash of lean-toolchain and lakefile.toml and is rebuilt only when those pins change,
# so historical verification bundles keep a reproducible base. workflow_dispatch builds
# any ref, with the slow verifier step optional.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: develop
        required: true
      verifier:
        description: Also build the Lean base and the verifier (slow)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  app:
    name: web and api images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: web
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/wishpool-web
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - id: api
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/wishpool-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api.outputs.tags }}
          labels: ${{ steps.api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  verifier:
    name: Lean base and verifier images
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verifier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Make room for the pinned Mathlib workspace
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lean base tag from the pinned toolchain and lakefile
        id: pin
        run: echo "tag=$(cat infra/verifier/lean-toolchain infra/verifier/lakefile.toml | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Is the Lean base for these pins already published?
        id: base
        run: |
          if docker buildx imagetools inspect "$REGISTRY/wishpool-lean:${{ steps.pin.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the prepared Lean base
        if: steps.base.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/verifier/Lean.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/wishpool-lean:${{ steps.pin.outputs.tag }}
      - name: Resolve the Lean base digest
        id: lean
        run: |
          digest=$(docker buildx imagetools inspect "$REGISTRY/wishpool-lean:${{ steps.pin.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=$REGISTRY/wishpool-lean@$digest" >> "$GITHUB_OUTPUT"
      - id: verifier
        uses: docker/metadata-action@v5
        with:
          context: git
          images: ${{ env.REGISTRY }}/wishpool-verifier
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build the verifier and run the real Lean proof checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/verifier/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: LEAN_IMAGE=${{ steps.lean.outputs.image }}
          tags: ${{ steps.verifier.outputs.tags }}
          labels: ${{ steps.verifier.outputs.labels }}
          cache-from: type=gha,scope=verifier
          cache-to: type=gha,scope=verifier,mode=max
