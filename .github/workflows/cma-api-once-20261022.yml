name: Mathesis CMA API image (2026-10-22 only)
on:
  push:
    branches: [deploy/cma-api-20261022]
    paths: [.github/workflows/cma-api-once-20261022.yml]
permissions:
  contents: read
jobs:
  api-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: ae641a0b54ee336da818c477b69fb7704bfdaaa6
      IMAGE: ghcr.io/the-omega-institute/mathesis-api:cma-ae641a0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae641a0b54ee336da818c477b69fb7704bfdaaa6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Validate CMA adapter
        working-directory: api
        run: |
          cargo fmt --all --check
          cargo test --locked -p mathesis-review cma::
          cargo clippy --locked -p mathesis-review --all-targets --all-features -- -D warnings
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API and worker image from verified source
        run: |
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=https://github.com/the-omega-institute/mathesis" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f infra/api/Dockerfile -t "$IMAGE" .
      - name: Verify non-root API and worker runtime
        run: |
          test "$(docker run --rm --network none --entrypoint id "$IMAGE" -u)" != 0
          for role in api worker; do
            docker run --rm --network none \
              -e WISHPOOL_BIND=127.0.0.1:8080 -e WISHPOOL_PUBLIC_URL=http://127.0.0.1:8080 \
              -e WISHPOOL_AUTH_MODE=dev -e WISHPOOL_STORAGE=memory -e WISHPOOL_ROLE="$role" \
              "$IMAGE" --check
          done
      - name: Publish image and digest
        run: |
          docker push "$IMAGE"
          mkdir -p receipts
          docker image inspect "$IMAGE" --format '{{json .}}' > receipts/api.json
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > receipts/api.digest
          cat receipts/api.digest
      - uses: actions/upload-artifact@v4
        with:
          name: mathesis-cma-api-receipt
          path: receipts/
