name: Mathesis CMA API image (2026-10-23 only)
on:
  push:
    branches: [deploy/cma-api-20261023-admission]
    paths: [.github/workflows/cma-api-once-20261023.yml]
permissions:
  contents: read
jobs:
  api-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REVISION: 3809ef8909a7da132bceb2379a37adcd61ecb67a
      IMAGE: ghcr.io/the-omega-institute/mathesis-api:cma-3809ef8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3809ef8909a7da132bceb2379a37adcd61ecb67a
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Validate CMA adapter
        working-directory: api
        run: |
          cargo fmt --all --check
          cargo test --locked -p mathesis-review cma::
          cargo clippy --locked -p mathesis-review --all-targets --all-features -- -D warnings
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API and worker image from verified source
        run: |
          # Reuse the verified immutable TeX/runtime layer; compile the final source anew.
          printf '%s  %s\n' 'e1e2a23e5e669488cd2939d197dc98542f056baa5cce820a75c51a872ec4f4d1' infra/api/Dockerfile | sha256sum -c -
          sed '/^FROM debian:trixie-slim/,$d' infra/api/Dockerfile > "$RUNNER_TEMP/mathesis-api.Dockerfile"
          cat >> "$RUNNER_TEMP/mathesis-api.Dockerfile" <<'DOCKER'
          FROM ghcr.io/the-omega-institute/mathesis-api@sha256:c9e04547202c40117e37ba7756b6ac9cd7cfd4f420b3e2cb6c64ea6fc6906297
          COPY --from=build /usr/local/bin/mathesis /usr/local/bin/mathesis
          USER 65532:65532
          EXPOSE 8080
          ENTRYPOINT ["/usr/local/bin/mathesis"]
          DOCKER
          docker buildx build --platform linux/amd64 --load \
            --label "org.opencontainers.image.source=https://github.com/the-omega-institute/mathesis" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            -f "$RUNNER_TEMP/mathesis-api.Dockerfile" -t "$IMAGE" .
      - name: Verify non-root API and worker runtime
        run: |
          test "$(docker run --rm --network none --entrypoint id "$IMAGE" -u)" != 0
          for role in api worker; do
            docker run --rm --network none \
              -e WISHPOOL_BIND=127.0.0.1:8080 -e WISHPOOL_PUBLIC_URL=http://127.0.0.1:8080 \
              -e WISHPOOL_AUTH_MODE=dev -e WISHPOOL_STORAGE=memory -e WISHPOOL_ROLE="$role" \
              "$IMAGE" --check
          done
      - name: Publish image and digest
        run: |
          docker push "$IMAGE"
          mkdir -p receipts
          docker image inspect "$IMAGE" --format '{{json .}}' > receipts/api.json
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > receipts/api.digest
          cat receipts/api.digest
      - uses: actions/upload-artifact@v4
        with:
          name: mathesis-cma-api-receipt
          path: receipts/
