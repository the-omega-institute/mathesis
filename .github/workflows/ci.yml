name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request runs the gates of the areas it changes. Every other event
  # (pushes to develop and main) runs all of them: each output below is true
  # without consulting the step. A job skipped by its `if:` reports as skipped,
  # which satisfies a required status check; a workflow-level `paths:` filter
  # would leave that check pending.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ github.event_name != 'pull_request' || steps.areas.outputs.api == 'true' }}
      sdk: ${{ github.event_name != 'pull_request' || steps.areas.outputs.sdk == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.areas.outputs.web == 'true' }}
      images: ${{ github.event_name != 'pull_request' || steps.areas.outputs.images == 'true' }}
      api_image: ${{ github.event_name != 'pull_request' || steps.areas.outputs.api_image == 'true' }}
      web_image: ${{ github.event_name != 'pull_request' || steps.areas.outputs.web_image == 'true' }}
      verifier: ${{ github.event_name != 'pull_request' || steps.areas.outputs.verifier == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Areas changed against the pull request base
        id: areas
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          api=false sdk=false web=false images=false api_image=false web_image=false verifier=false all=false
          # The verifier image compiles only mathesis-verifier. Sources of the
          # other crates are not its inputs while its manifest names no
          # workspace crate.
          verifier_alone=false
          if awk '!/^name *=/ && /mathesis-|path *=/ { exit 1 }' api/crates/verifier/Cargo.toml; then
            verifier_alone=true
          fi
          # GitHub tests the merge of the pull request into its base: the first
          # parent is the base, the second the pull request head. Without that
          # shape, or for a path no rule names, every gate runs.
          head=$(git rev-parse --verify --quiet 'HEAD^2' || true)
          if [ -n "$head" ] && [ "$head" = "$HEAD_SHA" ] &&
            files=$(git diff --name-only --no-renames 'HEAD^1' HEAD); then
            sed 's/^/changed: /' <<< "$files"
            while IFS= read -r path; do
              case "$path" in
                '' | docs/* | README.md | CLAUDE.md) ;;
                sdk/*) sdk=true ;;
                web/*)
                  web=true images=true web_image=true
                  # API tests check the LaTeX reader against the web citation fixtures.
                  case "$path" in web/src/test/*.json) api=true ;; esac
                  ;;
                api/*)
                  api=true images=true api_image=true
                  case "$path" in
                    api/crates/verifier/*) verifier=true ;;
                    api/crates/*/src/* | api/crates/*/tests/*) [ "$verifier_alone" = true ] || verifier=true ;;
                    *) verifier=true ;;
                  esac
                  ;;
                infra/*)
                  # API tests read the configuration keys declared in infra/api,
                  # web tests the Mathlib pin in infra/verifier, kubeconform
                  # every manifest.
                  api=true web=true images=true
                  case "$path" in
                    infra/api/*) api_image=true ;;
                    infra/web/*) web_image=true ;;
                    infra/verifier/*) verifier=true ;;
                  esac
                  ;;
                *) all=true ;;
              esac
            done <<< "$files"
          else
            echo "::warning::HEAD is not the merge commit of this pull request; running every gate"
            all=true
          fi
          if [ "$all" = true ]; then
            api=true sdk=true web=true images=true api_image=true web_image=true verifier=true
          fi
          printf '%s\n' "api=$api" "sdk=$sdk" "web=$web" "images=$images" \
            "api_image=$api_image" "web_image=$web_image" "verifier=$verifier" | tee -a "$GITHUB_OUTPUT"

  structure:
    name: Repository structure and layer rule
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Root contains only the allowed entries
        run: |
          allowed=".git .github .gitignore .dockerignore CLAUDE.md README.md api web sdk infra docs"
          for entry in $(ls -A); do
            case " $allowed " in *" $entry "*) ;; *) echo "::error::unexpected root entry: $entry"; exit 1 ;; esac
          done
      - name: infra contains only the fixed file list
        run: |
          expected="infra/api/Dockerfile infra/api/configmap.yaml infra/api/deployment.yaml infra/api/secret.yaml infra/api/service.yaml infra/web/Dockerfile infra/web/deployment.yaml infra/web/nginx.conf infra/web/service.yaml infra/worker/deployment.yaml infra/worker/pvc.yaml infra/verifier/Dockerfile infra/verifier/Lean.Dockerfile infra/verifier/lean-toolchain infra/verifier/lakefile.toml infra/verifier/mathesis-libraries.json infra/verifier/library-modules.txt infra/verifier/library-proof.json infra/verifier/deployment.yaml"
          actual=$(find infra -type f | sort | tr '\n' ' ')
          [ "$(echo $expected | tr ' ' '\n' | sort | tr '\n' ' ')" = "$actual" ] || { echo "::error::infra/ diverged: $actual"; exit 1; }
      - name: Layer dependency rule
        run: |
          production_dependencies() {
            awk '/^\[dependencies\]$/ { d=1; next } /^\[/ { d=0 } d { print }' "$1"
          }
          fail=0
          production_dependencies api/crates/layer2-core/Cargo.toml | grep -qE 'mathesis-(public|review|latex)|mongodb|axum|reqwest|jsonwebtoken' \
            && { echo "::error::layer2-core must not depend on Layer 1, Layer 3 or I/O crates"; fail=1; }
          production_dependencies api/crates/layer1-public/Cargo.toml | grep -qE 'mathesis-(review|latex)|mongodb|reqwest' \
            && { echo "::error::layer1-public may depend only on layer2-core"; fail=1; }
          for crate in layer3-review layer3-latex; do
            production_dependencies api/crates/$crate/Cargo.toml | grep -qE 'mathesis-(core|public)' \
              && { echo "::error::$crate must not depend on Layer 1 or Layer 2"; fail=1; }
          done
          exit $fail
      - name: Every config key is declared in infra
        run: |
          keys=$(grep -ohE '"(WISHPOOL|CHRONO)_[A-Z_]+"' api/crates/mathesis/src/config.rs | tr -d '"' | sort -u)
          for key in $keys; do
            grep -q "^  $key:" infra/api/configmap.yaml infra/api/secret.yaml || { echo "::error::$key missing from infra/api"; exit 1; }
          done

  api:
    name: API (fmt, clippy, tests, deny)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        # GitHub's ubuntu-24.04 runners moved to a Linux kernel in the 6.19–7.0.13
        # range, where mongod 8.x refuses to start (SERVER-121912: the vendored
        # TCMalloc's own rseq registration). Letting glibc own rseq makes
        # TCMalloc fall back to its non-rseq path, which starts on those kernels.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
    env:
      WISHPOOL_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      WISHPOOL_TEST_TEX_BIN: /usr/bin
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live for the compile tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: api/Cargo.toml

  sdk:
    name: Contributor SDK (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/contribute
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/contribute
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  web:
    name: Web (format, lint, types, tests, build, audit)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run build:showcase
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned by checksum; the gitleaks GitHub Action needs
      # a paid licence on organisation repositories.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose .

  images:
    name: Images and manifests
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.api_image == 'true'
        run: docker build -f infra/api/Dockerfile -t mathesis-api:ci .
      - if: needs.changes.outputs.web_image == 'true'
        run: docker build -f infra/web/Dockerfile -t mathesis-web:ci .
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary infra/api/*.yaml infra/web/*.yaml infra/worker/*.yaml infra/verifier/*.yaml

  verifier:
    name: Verifier image and real Lean proofs
    needs: changes
    if: needs.changes.outputs.verifier == 'true'
    runs-on: ubuntu-24.04
    # A run whose Lean base inputs have no published image yet compiles the
    # prepared library itself; every later run reuses the published base.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the pinned Mathlib workspace
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: Reuse the published Lean base of these exact inputs
        id: base
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # The same formula as publish-images.yml: every input of Lean.Dockerfile.
          pin=$(cat infra/verifier/lean-toolchain infra/verifier/lakefile.toml infra/verifier/mathesis-libraries.json infra/verifier/library-modules.txt infra/verifier/Lean.Dockerfile | sha256sum | cut -c1-12)
          image="ghcr.io/${OWNER,,}/mathesis-lean:$pin"
          if echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
            && docker pull --platform linux/amd64 "$image" >/dev/null 2>&1; then
            docker tag "$image" mathesis-lean:ci
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $image"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "No readable published Lean base for pin $pin; building it here."
          fi
      - name: Build prepared Lean base
        if: steps.base.outputs.reused != 'true'
        run: docker build --platform linux/amd64 -f infra/verifier/Lean.Dockerfile -t mathesis-lean:ci .
      - name: Build verifier and check real proofs, disproofs and invalid proofs
        run: docker build --build-arg LEAN_IMAGE=mathesis-lean:ci -f infra/verifier/Dockerfile -t mathesis-verifier:ci .
