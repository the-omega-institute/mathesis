# One public origin: static app, with /api and /auth proxied to the API so the
# session cookie and Origin checks see a single site.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|auth)/ {
        proxy_pass http://wishpool-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # LaTeX source uploads (api MAX_UPLOAD_BYTES is 30 MB).
        # JSON escaping can expand an 8 MiB Lean project; application byte limits still apply.
        client_max_body_size 64m;
    }

    # Stable public HTML and PDF aliases for academic crawlers.
    location ~ ^/papers/([^/]+)/(landing\.html|pdf)$ {
        rewrite ^/papers/([^/]+)/(landing\.html|pdf)$ /api/v1/papers/$1/$2 break;
        proxy_pass http://wishpool-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /sitemap.xml {
        proxy_pass http://wishpool-api:8080/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\nSitemap: https://$host/sitemap.xml\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
