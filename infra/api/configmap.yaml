# Every non-secret key read by api/crates/mathesis/src/config.rs. The worker
# deployment uses the same map and overrides WISHPOOL_ROLE.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wishpool-api
  namespace: wishpool
  labels:
    app.kubernetes.io/name: wishpool-api
    app.kubernetes.io/part-of: wishpool
data:
  WISHPOOL_BIND: "0.0.0.0:8080"
  WISHPOOL_PUBLIC_URL: "https://mathesis.example.org"
  WISHPOOL_ROLE: "api"
  WISHPOOL_REVIEW_CONCURRENCY: "2"
  # Immutable downstream index revision, imported into this deployment's MongoDB.
  WISHPOOL_KNOWLEDGE_INDEX: ""
  WISHPOOL_STORAGE: "mongo"
  WISHPOOL_MONGODB_DATABASE: "wishpool"
  WISHPOOL_AUTH_MODE: "nyxid"
  CHRONO_NYXID_BASE_URL: "https://nyx.chrono-ai.fun"
  # Comma-separated NyxID subjects granted Admin on sign-in.
  WISHPOOL_ADMIN_SUBJECTS: ""
  # Venue preparation accounts: CMA-only referee, no active-submission count cap.
  # This grants no role or publication exemption. Empty keeps ordinary behavior.
  WISHPOOL_INTERNAL_SUBJECTS: ""
  WISHPOOL_REVIEW_ACCOUNT: "wishpool:review-engine"
  # OpenAI-compatible base URL of the review model; the NyxID LLM gateway.
  WISHPOOL_REVIEW_MODEL_BASE_URL: "https://nyx.chrono-ai.fun/api/v1/llm/gateway/v1"
  WISHPOOL_REVIEW_MODEL: "claude-opus-5-5"
  # LaTeX compilation (worker role) with the image's TeX Live; font and
  # format caches live on the worker volume.
  WISHPOOL_TEX_BIN: "/usr/bin"
  WISHPOOL_TEX_CACHE: "/var/cache/texmf"
  # Optional extra texmf tree for packages beyond the image's TeX Live.
  WISHPOOL_TEXMF_HOME: ""
  WISHPOOL_COMPILE_TIMEOUT_SECS: "180"
  # Donated quota through NyxID delegated access; off until confirmed with
  # the NyxID owners.
  WISHPOOL_HOSTED_DONATIONS: "false"
  WISHPOOL_LLM_GATEWAY_URL: "https://nyx.chrono-ai.fun/api/v1/llm/gateway/v1"
  WISHPOOL_DONATION_SCOPE: "openid offline_access proxy"
  WISHPOOL_DONATION_SERVICE_IDS: ""
  WISHPOOL_DONATION_MODEL: "claude-opus-5-5"
  WISHPOOL_HOSTED_INTERVAL_SECS: "30"
  RUST_LOG: "info"
  # Referee rounds are opt-in. CLI modes are refused on this production bind.
  WISHPOOL_ORACLE: ""
  WISHPOOL_ORACLE_BASE_URL: "https://nyx-api.chrono-ai.fun/api/v1/proxy/s/oracle"
  WISHPOOL_ORACLE_POOL: "chrono-chatgpt-pro-pool"
  WISHPOOL_ORACLE_MODEL: "chatgpt-6-pro"
  WISHPOOL_ORACLE_CLI: "nyxid"
  WISHPOOL_ORACLE_POLL_SECS: "60"
  WISHPOOL_REFEREE_ACCOUNT: "wishpool:referee"
  WISHPOOL_AUDITOR_ACCOUNT: "wishpool:auditor"
  # CMA is the default when an existing workspace is configured. HTTP accepts
  # NyxID user access tokens only; provision the mounted token file out of band.
  WISHPOOL_AGENT_BACKEND: ""
  WISHPOOL_CMA_WORKSPACE: ""
  WISHPOOL_CMA_FORMALIZATION_WORKSPACE: ""
  # Pin a published profile readable by executing accounts; required for all CMA modes.
  WISHPOOL_CMA_AGENT_PROFILE: ""
  # Author CMA consent is independent of hosted donations. Requires NyxID, HTTP
  # transport and WISHPOOL_TOKEN_KEY. Authors provision their own_credentials workspace.
  WISHPOOL_CMA_BYOK_ENABLED: "false"
  WISHPOOL_CMA_PUBLIC_URL: "https://cma.chrono-ai.fun"
  WISHPOOL_CMA_TRANSPORT: "http"
  WISHPOOL_CMA_BASE_URL: "https://nyx-api.chrono-ai.fun/api/v1/proxy/s/cma"
  WISHPOOL_CMA_TOKEN_FILE: ""
  WISHPOOL_CMA_TOKEN_ACCOUNT: ""
  WISHPOOL_CMA_CLI: "nyxid"
  WISHPOOL_CMA_POLL_SECS: "5"
  # Explicit legacy development/chat configuration; CMA workspace takes priority.
  WISHPOOL_ADVISOR: ""
  WISHPOOL_CODEX_BIN: "codex"
  WISHPOOL_CODEX_MODEL: ""
  WISHPOOL_ADVISOR_MODEL: "gpt-5.5"
  # Advice and letters default to 20 minutes; the audit has its own longer
  # deadline because the worker renews its 30-minute lease while it runs.
  WISHPOOL_ADVISOR_TIMEOUT_SECS: "1200"
  WISHPOOL_AUDIT_TIMEOUT_SECS: "3600"
  WISHPOOL_ADVISOR_WORK_DIR: "/tmp/wishpool-advisor"
  # Prepared Lean/Mathlib project for private proof probes and conjecture targets.
  WISHPOOL_LEAN_WORKSPACE: ""
  # Codex: at most 3600 seconds; the step budget includes discovery/check margin.
  WISHPOOL_FORMAL_TIMEOUT_SECS: "1200"
  # Isolated verifier; empty URL uses a local credential-free subprocess.
  WISHPOOL_VERIFIER_URL: "http://wishpool-verifier:8081"
  WISHPOOL_VERIFIER_PROGRAM: "mathesis-verifier"
  WISHPOOL_VERIFIER_TIMEOUT_SECS: "1200"
  WISHPOOL_ATTEMPTS_PER_DAY: "20"

# Error reports: five per entrant per rolling 24h; no extra deployment key.
# Target faithfulness and report audits reuse the existing CMA audit timeout.
# Donations attribute venue CMA runs; delegated-token execution/usage receipts
# are not supplied by current CMA v2. Supporters never estimates tokens.
