[package]
name = "mathesis-catalog"
description = "Deterministic offline catalog generator for public Mathesis papers."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mathesis-catalog"
path = "src/main.rs"

[dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_yaml = "0.9"
